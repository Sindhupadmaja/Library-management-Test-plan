<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section id="loginPanel" class="card">
      <h1>Library Management System</h1>
      <p>QA portfolio prototype</p>
      <label>Username</label>
      <input id="username" type="text" placeholder="Username">
      <label>Password</label>
      <input id="password" type="password" placeholder="Password">
      <button id="loginBtn">Login</button>
      <p id="loginMessage" class="message"></p>
      <small>Demo: student / library123</small>
    </section>

    <section id="libraryPanel" class="card hidden">
      <div class="header">
        <div>
          <h1>Library Dashboard</h1>
          <p>Signed in as <strong id="currentUser"></strong></p>
        </div>
        <button id="logoutBtn" class="secondary">Logout</button>
      </div>

      <div class="search">
        <input id="searchInput" type="text" placeholder="Search by title or author">
        <button id="searchBtn">Search</button>
        <button id="showAllBtn" class="secondary">Show All</button>
      </div>

      <p id="libraryMessage" class="message"></p>
      <div id="bookList"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
